services:
  postgres:
    image: supabase/postgres:17.6.1.091_arm64
    restart: always
    env_file: ${DATA_ROOT}/docker/.env
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:5432:5432" # Accessible only from inside the server
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ${DATA_ROOT}/docker/init:/docker-entrypoint-initdb.d

  postgrest:
    container_name: postgrest
    image: postgrest/postgrest:latest
    restart: always
    deploy: # Please adjust the resource according to your usecase
      resources:
        limits:
          cpus: '1'
          memory: 1G
    ports:
      - "3001:3000"
    depends_on:
      - postgres
    env_file: ${DATA_ROOT}/docker/.env


  meilisearch:
    image: getmeili/meilisearch
    ports:
      - "7700:7700"

  pigallery2:
    image: bpatrik/pigallery2:latest
    container_name: pigallery2
    restart: always
    env_file:
      - ${DATA_ROOT}/docker/.env
    ports:
      - "3000:3000"
    volumes:
      - "${DATA_ROOT}/pigallery2/config:/app/data/config"
      - "${DATA_ROOT}/pigallery2/db-data:/app/data/db"
      - "${DATA_ROOT}/pigallery2/images:/app/data/images:ro" # ':ro' means read-only
      - "${DATA_ROOT}/pigallery2/tmp:/app/data/tmp"

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DATA_ROOT}/docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
