services:
  postgres:
    image: supabase/postgres:17.6.1.091_arm64
    restart: always
    env_file: ${DATA_ROOT}/docker/.env
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:5434:5432" # Accessible only from inside the server
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ${DATA_ROOT}/docker/init:/docker-entrypoint-initdb.d

  postgrest:
    container_name: postgrest
    image: postgrest/postgrest:latest
    restart: always
    deploy: # Please adjust the resource according to your usecase
      resources:
        limits:
          cpus: '1'
          memory: 1G
    ports:
      - "127.0.0.1:3010:3000" # Accessible only from inside the server
    depends_on:
      - postgres
    env_file: ${DATA_ROOT}/docker/.env


  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    restart: always
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - "${DATA_ROOT}/meili_data:/meili_data"
      # - "${DATA_ROOT}/docker/meilisearch/config.toml:/meili_config/config.toml"
    # command: >
    #   meilisearch
    #   --config-file-path /meili_config/config.toml

  pigallery2:
    image: bpatrik/pigallery2:latest
    container_name: pigallery2
    restart: always
    env_file:
      - ${DATA_ROOT}/docker/.env
    ports:
      - "127.0.0.1:3020:80" # Accessible only from inside the server
    volumes:
      - "${DATA_ROOT}/pigallery2/config:/app/data/config"
      - "${DATA_ROOT}/pigallery2/db-data:/app/data/db"
      - "${DATA_ROOT}/pigallery2/images:/app/data/images:ro" # ':ro' means read-only
      - "${DATA_ROOT}/pigallery2/tmp:/app/data/tmp"

  caddy:
    image: caddy:2
    profiles: ["server"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DATA_ROOT}/docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      # On the data volume so TLS certs survive instance replacement
      - ${DATA_ROOT}/caddy/data:/data
      - ${DATA_ROOT}/caddy/config:/config
